name: Validate Furuya Motion Studio
on:
  push:
    paths:
      - 'recast.html'
      - 'recast.js'
      - 'generate.html'
      - 'generate.js'
      - 'multicast.html'
      - 'multicast.js'
      - 'engine-catalog.json'
      - 'routing-policy.json'
      - 'cloud/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/validate-recast.yml'
  pull_request:
    paths:
      - 'recast.html'
      - 'recast.js'
      - 'generate.html'
      - 'generate.js'
      - 'multicast.html'
      - 'multicast.js'
      - 'engine-catalog.json'
      - 'routing-policy.json'
      - 'cloud/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/validate-recast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg for real CPU video fixtures
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: JavaScript syntax check
        run: |
          node --check recast.js
          node --check generate.js
          node --check multicast.js
      - name: Recasting editor smoke test
        run: |
          node tests/recast_smoke.mjs
          node tests/multiengine_ui_smoke.mjs
          node tests/multicast_ui_smoke.mjs
      - name: Python clip tools syntax check
        run: python -m py_compile tools/prepare_clip.py cloud/viggle_inference.py cloud/viggle_remix_api.py cloud/local_render_gateway.py cloud/engine_registry.py cloud/auto_router.py cloud/comfyui_local_bridge.py cloud/wan22_animate_adapter.py cloud/wan_animate2_adapter.py tools/audit_generated_video.py tools/validate_multicast_plan.py tools/export_temporal_boxes.py tests/test_temporal_boxes.py tests/test_comfyui_bridge.py tests/test_multicast_plan.py tests/test_auto_router.py tests/test_generated_video_audit.py tests/test_multiengine.py tests/test_local_render_gateway.py tests/test_prepare_clip.py tests/test_viggle_remix_api.py tests/test_gpu_preflight.py tests/test_viggle_adapter.py
      - name: Reproducible CPU-only clip preparation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Python preflight syntax check
        run: python -m py_compile cloud/free_gpu_preflight.py
      - name: Free GPU preflight never needs GPU or payment
        run: |
          python cloud/free_gpu_preflight.py --workdir . > /tmp/furuya_gpu_report.json
          python -c "import json; r=json.load(open('/tmp/furuya_gpu_report.json')); assert r['spent_money']==0 and r['downloads_started']==False and r['models_loaded']==False; print('PASS: preflight is read-only')"
